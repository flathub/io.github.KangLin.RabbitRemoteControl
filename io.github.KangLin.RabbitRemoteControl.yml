# [flatpak manifest](https://docs.flatpak.org/en/latest/flatpak-builder-command-reference.html#flatpak-manifest)
id: io.github.KangLin.RabbitRemoteControl
# See: [available runtimes](https://docs.flatpak.org/en/latest/available-runtimes.html)
# See: [flatpak kde runtime](https://invent.kde.org/packaging/flatpak-kde-runtime)
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: RabbitRemoteControlApp

base: io.qt.qtwebengine.BaseApp
base-version: '6.9'
cleanup-commands:
  - /app/cleanup-BaseApp.sh

build-options:
  env:
    V: '1'
    # 修复 qtwebengine 沙箱权限问题
    QTWEBENGINE_DISABLE_SANDBOX: '1'

cleanup:
  - '*.la'
  - '*.a'
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/licenses

finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=pcsc
  - --socket=ssh-auth
  - --socket=x11
  - --device=all
  - --filesystem=xdg-documents
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.Avahi
  # Because the file chooser somehow doesn't show the files on the host, we export some directory for reading pcap files
  # https://bugs.wireshark.org/bugzilla/show_bug.cgi?id=15507
  - --filesystem=xdg-public-share
  - --filesystem=home:ro
  # https://github.com/flathub/io.qt.qtwebengine.BaseApp
  - --device=dri
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess

modules:
  - name: xprop
    disabled: false
    sources:
      - type: archive
        url: https://xorg.freedesktop.org/releases/individual/app/xprop-1.2.5.tar.bz2
        sha256: 9b92ed0316bf2486121d8bac88bd1878f16b43bd335f18009b1f941f1eca93a1
    cleanup:
      - /bin/xprop
      - /share/doc
      - /share/man

  - name: pcsc
    disabled: false
    config-opts:
      - --disable-libsystemd
      - --enable-pic
      - --disable-libusb
      - --enable-shared
      - --with-systemdsystemunitdir=/app/lib/systemd/
    sources:
      - type: git
        url: https://github.com/LudovicRousseau/PCSC.git
        tag: 1.9.9
        commit: 15c16c7796607b1c8a2ce253d3f536918ab26b4a
    cleanup:
      - /bin/pcsc-spy
      - /sbin
      - /share/doc
      - /share/man
      - /lib/systemd

  - name: krb5
    disabled: false
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.21/krb5-1.21.3.tar.gz
        sha256: b7a4cd5ead67fb08b980b21abd150ff7217e85ea320c9ed0c6dadd304840ad35
      - type: script
        commands:
          - autoreconf --install --symlink
    buildsystem: autotools
    subdir: src
    cleanup:
      - /sbin
      - /bin
      - /share

  - name: libssh
    disabled: false
    sources:
      - type: archive
        url: https://www.libssh.org/files/0.11/libssh-0.11.3.tar.xz
        sha256: 7d8a1361bb094ec3f511964e78a5a4dba689b5986e112afabe4f4d0d6c6125c3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DWITH_EXAMPLES=OFF
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin

  - name: libfuse
    disabled: false
    sources:
      - type: archive
        url: https://github.com/libfuse/libfuse/archive/refs/tags/fuse-3.16.2.tar.gz
        sha256: 1bc306be1a1f4f6c8965fbdd79c9ccca021fdc4b277d501483a711cbd7dbcd6c
    buildsystem: meson
    builddir: true
    config-opts:
      - -Dexamples=false
      - -Dutils=false

  - shared-modules/libusb/libusb.json
  - shared-modules/libsecret/libsecret.json

  - name: curl
    disabled: false
    sources:
      - type: archive
        url: https://github.com/curl/curl/releases/download/curl-8_16_0/curl-8.16.0.tar.xz
        sha256: 40c8cddbcb6cc6251c03dea423a472a6cea4037be654ba5cf5dec6eb2d22ff1d
    buildsystem: autotools
    config-opts:
      - --with-openssl

  - name: FreeRDP
    disabled: false
    sources:
      - type: git
        url: https://github.com/FreeRDP/FreeRDP.git
        tag: 3.15.0
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_VERBOSE_MAKEFILE=OFF
      - -DCMAKE_BUILD_TYPE=Release
      - -DCHANNEL_TSMF:BOOL=OFF
      - -DBUILD_TESTING:BOOL=OFF
      - -DWITH_MANPAGES:BOOL=OFF
      - -DWITH_WAYLAND:BOOL=OFF
      - -DWITH_GSSAPI:BOOL=OFF
      - -DWITH_SAMPLE:BOOL=OFF
      - -DWITH_OSS:BOOL=OFF
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_CLIENT=OFF
      - -DCHANNEL_URBDRC:BOOL=ON
      - -DWITH_KRB5=ON
    cleanup:
      - /bin
      - /share
      - /share/licenses

  - name: libvncserver
    disabled: false
    sources:
      - type: archive
        url: https://github.com/LibVNC/libvncserver/archive/refs/tags/LibVNCServer-0.9.15.tar.gz
        sha256: 62352c7795e231dfce044beb96156065a05a05c974e5de9e023d688d8ff675d7
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DWITH_OPENSSL=ON
      - -DWITH_GCRYPT=OFF
      - -DWITH_EXAMPLES=OFF
      - -DWITH_TESTS=OFF
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin
      - /lib/libvncserver.so*

  - name: pixman
    disabled: false
    sources:
      - type: archive
        url: https://cairographics.org/releases/pixman-0.46.0.tar.xz
        sha512: c7ef987b7db89c58278c537f862bc9eb17c19f8288a3b7e88f8501a0486662f1e2cb6a2c0b81d4bf0464310475192428d6e29d05a6ae3cfc1d2c0941fbb0b9a3
    buildsystem: meson
    builddir: true

  - name: pam
    disabled: false
    sources:
      - type: git
        url: https://github.com/linux-pam/linux-pam.git
        tag: v1.6.1
    buildsystem: autotools
    config-opts:
      - --disable-doc
    post-install:
      - cp -r libpam/include/* $FLATPAK_DEST/include

  - name: tigervnc
    disabled: false
    sources:
      - type: git
        url: https://github.com/KangLin/tigervnc.git
        commit: fd32c28515c83ec3db6b812f2ee8f5fbbcf29b33
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DBUILD_VIEWER=OFF
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin
      - /lib/*.so*

  - name: libpcap
    disabled: false
    sources:
      - type: archive
        url: http://www.tcpdump.org/release/libpcap-1.10.6.tar.gz
        sha256: 872dd11337fe1ab02ad9d4fee047c9da244d695c6ddf34e2ebb733efd4ed8aa9
        x-checker-data:
          type: anitya
          project-id: 1702
          url-template: http://www.tcpdump.org/release/libpcap-$version.tar.gz
    cleanup:
      - /share

  - name: PcapPlusPlus
    disabled: false
    sources:
      - type: archive
        url: https://github.com/seladb/PcapPlusPlus/archive/refs/tags/v25.05.tar.gz
        sha256: 66c11d61f3c8019eaf74171ad10229dfaeab27eb86859c897fb0ba1298f80c94
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPCAPPP_BUILD_EXAMPLES=OFF
      - -DPCAPPP_BUILD_TESTS=OFF
      - -DPCAPPP_INSTALL=ON
    cleanup:
      - /usr/share
      - /usr/local

  - name: lxqt-build-tools.git
    disabled: false
    sources:
      - type: git
        url: https://github.com/lxqt/lxqt-build-tools.git
        tag: 2.2.0
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release

  - name: qtermwidget
    disabled: false
    sources:
      - type: git
        url: https://github.com/lxqt/qtermwidget.git
        tag: 2.2.0
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release

  - name: cmark
    disabled: true
    sources:
      - type: archive
        url: https://github.com/commonmark/cmark/archive/refs/tags/0.31.1.tar.gz
        sha256: 3da93db5469c30588cfeb283d9d62edfc6ded9eb0edc10a4f5bbfb7d722ea802
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMARK_SHARED=OFF
      - -DCMARK_TESTS=OFF
      - -DCMARK_STATIC=ON
    cleanup:
      - /bin
      - /share/man

  - name: cmark-gfm
    disabled: false
    sources:
      - type: archive
        url: https://github.com/github/cmark-gfm/archive/refs/tags/0.29.0.gfm.13.tar.gz
        sha256: 5abc61798ebd9de5660bc076443c07abad2b8d15dbc11094a3a79644b8ad243a
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMARK_SHARED=OFF
      - -DCMARK_TESTS=OFF
      - -DCMARK_STATIC=ON
    post-install:
      - cp /app/lib/cmake/cmark-gfm.cmake $FLATPAK_DEST/lib/cmake/cmark-gfmConfig.cmake
      - cp /app/lib/cmake-gfm-extensions/cmark-gfm-extensions.cmake $FLATPAK_DEST/lib/cmake-gfm-extensions/cmark-gfm-extensionsConfig.cmake
    cleanup:
      - /bin
      - /share/man

  - name: qtkeychain
    disabled: false
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.15.0
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON

  - name: QFtpServer
    sources:
      - type: git
        url: https://github.com/KangLin/QFtpServer.git
        commit: 4e98ea4402cea73a9e028250aa025cd9bcbf337a
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DWITH_APP=OFF

  - name: RabbitCommon
    disabled: false
    sources:
      - type: git
        url: https://github.com/KangLin/RabbitCommon.git
        #tag: v2.3.3
        commit: d9518cdd8ce819b228dd5690ad5aa6e99e820526
        disable-shallow-clone: true
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_MimeTypeBrowser=OFF
      - -DBUILD_APP=OFF
      - -DBUILD_TEST=OFF
      - -DWITH_CMARK=OFF
      - -DWITH_CMARK_GFM=ON
      - -Dcmark-gfm_DIR=/app/lib/cmake
      - -Dcmark-gfm-extensions_DIR=/app/lib/cmake-gfm-extensions
      - -DWITH_WebEngineWidgets=ON
    cleanup:
      - /bin
      - /etc
      - /share/applications
      - /share/doc

  - name: RabbitRemoteControl
    disabled: false
    sources:
      - type: git
        url: https://github.com/KangLin/RabbitRemoteControl.git
        #tag: v0.0.36
        commit: 760df466ea3cece012be198da20e2f64f51bd61c
        disable-shallow-clone: true
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_FREERDP=ON
    cleanup:
      - -usr/bin/cmark
      - -usr/bin/cmark-gfm
      - -usr/local/bin/cmark
      - -usr/local/bin/cmark-gfm
      - -usr/local/include
      - -usr/local/lib/cmake*
      - -usr/local/lib/pkgconfig
      - -usr/local/lib/*.a
    post-install:
      - desktop-file-edit --set-key=Path --set-value=/bin /app/share/applications/io.github.KangLin.RabbitRemoteControl.desktop
      - install -Dm0644 io.github.KangLin.RabbitRemoteControl.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo/
